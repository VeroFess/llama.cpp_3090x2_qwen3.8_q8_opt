services:
  llama-qwen38:
    image: llama-qwen38-2x3090:local
    build:
      context: ..
      dockerfile: docker/qwen38-3090.Dockerfile
    ports:
      - "8080:8080"
    gpus:
      - driver: nvidia
        device_ids: ["0", "1"]
        capabilities: ["gpu"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0,1"
      GGML_CUDA_P2P: "1"
      GGML_CUDA_ALLREDUCE: "nccl"
      NCCL_DEBUG: "WARN"
      LLAMA_CUDA_WATCHDOG_MS: "300000"
    volumes:
      - type: bind
        source: ${QWEN38_MODEL}
        target: /models/Qwen3.8-27B-Q8_0.gguf
        read_only: true
    command:
      - --model
      - /models/Qwen3.8-27B-Q8_0.gguf
      - --alias
      - Qwen3.8-27B-Q8_0
      - --profile
      - qwen38-27b-q8-2x3090
      - --split-mode
      - tensor
      - --ubatch-size
      - "1024"
      - --reasoning
      - "off"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-webui
      - --metrics
    restart: unless-stopped
